<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Contact Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div class="form-container">
        <form>
            <h2>Contact Form</h2>
            <label for="name">Name: <input id="name" name="name" type="text" required></label>
            <label for="email">Email: <input id="email" name="email" type="email" required></label>
            <label for="message">Message: <textarea id="message" name="message" required></textarea></label>
            <button type="submit">Submit</button>    
        </form>
    </div>

</body>

</html>
