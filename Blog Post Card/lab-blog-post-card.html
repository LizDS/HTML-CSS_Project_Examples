<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="blog-post-card">
        <img class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="Person typing on a laptop with burred screen visible.">
        <div class="post-content">
            <h2 class="post-title">Learn to Code</h2>
            <p class="post-excerpt">Learning to code is the best thing you can do with your freetime...</p>
            <a class="read-more" href="https://www.freecodecamp.org/" target="_blank">Read More</a>
        </div>
    </div>

</body>
</html>
