<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Liz's To Do List📋</h1>
        </header>
        <main>
            <ul class="todo-list">
                <li>
                    <input type="checkbox" id="code" name="code"></input>
                    <label for="code">Learn to code</label>
                        <ul class="sub-item">
                            <li>
                                <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">Go to FreeCodeCamp</a>
                            </li>
                        </ul>
                </li>
                <li>
                    <input type="checkbox" id="make-smoothie" name="make-smoothie"></input>
                    <label for="make-smoothie">Make Green Juice Smoothie</label>
                    <ul class="sub-item">
                        <li>
                            <a class="sub-item-link" href="https://www.allrecipes.com/recipe/230642/healthy-green-juice/" target="_blank">Go to Recipe</a>
                        </li>
                    </ul>
                </li>
                <li>
                    <input type="checkbox" id="eat-out" name="eat-out"></input>                    
                    <label for="eat-out">Eat at "Curry House"</label>
                    <ul class="sub-item">
                        <li>
                            <a class="sub-item-link" href="https://www.instagram.com/curry_house_tashkent/?hl=en" target="_blank">"Curry House" Website</a>
                        </li>
                    </ul>
                </li>
                <li>
                    <input type="checkbox" id="play-risk" name="play-risk"></input>
                                    <label for="play-risk">Play Risk World Domination</label>
                    <ul class="sub-item">
                        <li>
                            <a class="sub-item-link" href="https://store.steampowered.com/app/1128810/RISK_Global_Domination/" target="_blank">Download Risk World Domiation on Steam</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </main>
        <footer>
            <hr>
            <p>End of today's list</p>
            <hr>
        </footer>
    </div>
</body>

</html>
